<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0kay</title>
    <script src="/vendor/live2dcubismcore.min.js"></script>
    <!-- Plugin ESM: bare `vue` imports resolve to the host bridge (one runtime). -->
    <script type="importmap">
      {
        "imports": {
          "vue": "/vendor/vue-bridge.js"
        }
      }
    </script>
    <!-- 0kay-darkmode 内联引导：宿主 WebUI 未实现 bootstrap target 时的回退（见插件 README）。
         同步设置 <html data-theme> 防首屏闪白，并异步注入 theme.js 使主题在每个页面自动生效。 -->
    <script>
      try {
        var m = localStorage.getItem('0kay_theme_mode') || 'auto';
        var dark;
        if (m === 'dark') dark = true;
        else if (m === 'light') dark = false;
        else if (m === 'schedule') {
        } else {
          dark = matchMedia('(prefers-color-scheme: dark)').matches;
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
      (function () {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/api/plugins/darkmode/ui/theme.js';
        document.head.appendChild(s);
      })();
    </script>
    <style>
      html[data-theme="dark"] { color-scheme: dark; background: #14161d; }
      html[data-theme="dark"] body { background: #14161d; color: #e3e6ee; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
